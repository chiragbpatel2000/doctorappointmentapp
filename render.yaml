# Render Blueprint: one web service runs both the API and the React app.
services:
  - type: web
    name: docbook
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # you paste your Neon connection string in the Render dashboard
